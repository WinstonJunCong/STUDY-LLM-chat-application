services:
# Download model on first run
  model-downloader:
    image: alpine:latest
    container_name: winston-model-downloader
    volumes:
      - ./models:/models
    command: |
      sh -c "mkdir -p /models && \
      apk add --no-cache curl && \
      if [ ! -f /models/Qwen3.5-2B-Q4_K_M.gguf ]; then \
      echo 'Downloading unsloth/Qwen3.5-2B model...' && \
      curl -L --retry 3 --connect-timeout 30 -o /models/Qwen3.5-2B-Q4_K_M.gguf \
      'https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf'; \
      echo 'Download complete!'; \
      else \
      echo 'Model already exists, skipping download'; \
      fi"

  # llama.cpp server
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: winston-llamacpp
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: [
      "-m", "/models/Qwen3.5-2B-Q4_K_M.gguf",
      "--host", "0.0.0.0",
      "--port", "8080",
      "-ngl", "32",
      "--chat-template", "chatml"
    ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-chat-backend
    ports:
      - "8000:8000"
    environment:
      - LLAMACPP_URL=http://llamacpp:8080
      - DATABASE_PATH=/app/data/chat.db
    depends_on:
      - llamacpp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: llm-chat-frontend
    ports:
      - "8501:8501"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  models: