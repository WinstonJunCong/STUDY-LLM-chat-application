services:
  # Download model on first run
  model-downloader:
    image: alpine:latest
    container_name: QuikSesh-model-downloader
    volumes:
      - ./models:/models
    command: |
      sh -c "mkdir -p /models && \
      apk add --no-cache curl && \
      if [ ! -f /models/Qwen3.5-4B-Q3_K_S.gguf ]; then \
      echo 'Downloading Qwen3.5-4B model...' && \
      curl -L --retry 3 --connect-timeout 30 -o /models/Qwen3.5-4B-Q3_K_S.gguf 'https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q3_K_S.gguf' && \
      echo 'Download complete!'; \
      else \
      echo 'Model already exists, skipping download'; \
      fi"

  # llama.cpp server
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: QuikSesh-llamacpp
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: [
      "-m", "/models/Qwen3.5-4B-Q3_K_S.gguf",
      "--host", "0.0.0.0",
      "-ngl", "32",
      "--ctx-size", "8192",
      # "--chat-template", "chatml",
      "--reasoning-format", "deepseek",
      "--flash-attn", "1",
      "-rea", "off"

    ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-chat-backend
    ports:
      - "8000:8000"
    environment:
      - LLAMACPP_URL=http://llamacpp:8080
      - DATABASE_PATH=/app/data/chat.db
    depends_on:
      llamacpp:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: llm-chat-frontend
    ports:
      - "8501:8501"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  models: