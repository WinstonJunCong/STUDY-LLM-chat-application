services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: winston-vllm
    ports:
      - "8001:8000"
    environment:
      - MODEL=meta-llama/Llama-3.2-1B-Instruct
      - GPU_MEMORY_UTILIZATION=0.9
      - MAX_NUM_SEQS=4
      - TENSOR_PARALLEL_SIZE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - vllm_model_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-chat-backend
    ports:
      - "8000:8000"
    environment:
      - VLLM_URL=http://vllm:8000
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Llama-3.2-1B-Instruct}
      - DATABASE_PATH=/app/data/chat.db
    depends_on:
      - vllm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: llm-chat-frontend
    ports:
      - "8501:8501"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vllm_model_cache: